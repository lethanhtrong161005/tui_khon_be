# ============================================================
# Production Environment Configuration
# ============================================================
spring.config.activate.on-profile=prod

# Database Configuration (PostgreSQL)
spring.datasource.url=${TK_PROD_DB_URL}
spring.datasource.username=${TK_PROD_DB_USERNAME}
spring.datasource.password=${TK_PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis Configuration
spring.data.redis.host=${TK_REDIS_HOST}
spring.data.redis.port=${TK_REDIS_PORT}
spring.data.redis.password=${TK_REDIS_PASSWORD}

# App Security & JWT Settings
tk.jwt.secret=${TK_JWT_SECRET}
tk.jwt.access-token-expiration-ms=${TK_JWT_EXPIRY_MS}
tk.jwt.refresh-token-expiration-ms=${TK_JWT_REFRESH_EXPIRY_MS}
app.cors.allowed-origins=${TK_CORS_ALLOWED_ORIGINS}

# Logging Settings
logging.level.root=WARN
logging.level.com.tuikhon=INFO
