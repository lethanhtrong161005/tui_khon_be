# ============================================================
# Development Environment Configuration
# ============================================================
spring.config.activate.on-profile=dev

# Database Configuration (PostgreSQL)
spring.datasource.url=${TK_DEV_DB_URL}
spring.datasource.username=${TK_DEV_DB_USERNAME}
spring.datasource.password=${TK_DEV_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis Configuration
spring.data.redis.host=${TK_REDIS_HOST}
spring.data.redis.port=${TK_REDIS_PORT}
spring.data.redis.timeout=2000ms

# App Security & JWT Settings
tk.jwt.secret=${TK_JWT_SECRET}
tk.jwt.access-token-expiration-ms=${TK_JWT_EXPIRY_MS}
tk.jwt.refresh-token-expiration-ms=${TK_JWT_REFRESH_EXPIRY_MS}
app.cors.allowed-origins=${TK_CORS_ALLOWED_ORIGINS}

# Springdoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging Settings
logging.level.root=INFO
logging.level.com.tuikhon=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
