# ============================================================
# Local Environment Configuration (IntelliJ IDEA)
# ============================================================
spring.config.activate.on-profile=local

# Database Configuration (PostgreSQL)
spring.datasource.url=${TK_LOCAL_DB_URL:jdbc:postgresql://localhost:5432/tuikhon_db}
spring.datasource.username=${TK_LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${TK_LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis Configuration
spring.data.redis.host=${TK_REDIS_HOST:localhost}
spring.data.redis.port=${TK_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# App Security & JWT Settings
tk.jwt.secret=${TK_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
tk.jwt.access-token-expiration-ms=${TK_JWT_EXPIRY_MS:86400000}
tk.jwt.refresh-token-expiration-ms=${TK_JWT_REFRESH_EXPIRY_MS:604800000}
app.cors.allowed-origins=${TK_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Springdoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging Settings
logging.level.root=INFO
logging.level.com.tuikhon=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
